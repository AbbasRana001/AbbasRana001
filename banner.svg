<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-labelledby="t">
  <title id="t">Muhammad Abbas Rana — NLP Researcher and Data Science Intern</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#14304a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0a458"/>
      <stop offset="1" stop-color="#e0a458" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="1000" height="240" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="240" fill="url(#bg)"/>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#9fb3c8" opacity="0.32">
      <text x="720" y="62">urdu · roman urdu</text>
      <text x="720" y="92">code-switched</text>
      <text x="720" y="122">XLM-R · MuRIL</text>
      <text x="720" y="152">head 1 → head 2 → severity</text>
      <text x="720" y="182">krippendorff α ≥ 0.667</text>
    </g>
    <rect x="700" y="44" width="2" height="150" fill="#e0a458" opacity="0.5"/>

    <text x="56" y="105" font-family="Georgia,'Times New Roman',serif" font-size="46" font-weight="700" fill="#f4efe6" letter-spacing="0.5">Muhammad Abbas Rana</text>
    <rect x="56" y="122" width="300" height="3" fill="url(#line)"/>

    <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="24" fill="#c9d6e3">
      <text x="56" y="168" opacity="0">NLP Researcher · low-resource languages
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.30;0.33;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="56" y="168" opacity="0">Data Science Intern @ 10Pearls
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.36;0.63;0.66;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="56" y="168" opacity="0">Building ML systems that ship
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.69;0.96;1" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>

    <text x="56" y="206" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" fill="#7f97ad" letter-spacing="1.5">COMSATS UNIVERSITY ISLAMABAD, LAHORE · CLASS OF 2027</text>
  </g>
</svg>
