<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-labelledby="t">
  <title id="t">Muhammad Abbas Rana — NLP Researcher and Data Science Intern</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#14304a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0a458"/>
      <stop offset="1" stop-color="#e0a458" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="1000" height="200" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="200" fill="url(#bg)"/>

    <text x="500" y="95" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="50" font-weight="700" fill="#f4efe6" letter-spacing="0.5">Muhammad Abbas Rana</text>
    <rect x="350" y="114" width="300" height="3" fill="#e0a458" opacity="0.8"/>

    <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="24" fill="#c9d6e3" text-anchor="middle">
      <text x="500" y="157" opacity="0">NLP Researcher · low-resource languages
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="10s" begin="0s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="157" opacity="0">Building ML systems that ship
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="10s" begin="2.5s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="157" opacity="0">Data Science Intern @ 10Pearls
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="10s" begin="5s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="157" opacity="0">Computer Science Educator @ Eximus Education
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="10s" begin="7.5s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
</svg>
